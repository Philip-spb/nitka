name: nitka
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: nitka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nitka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nitka}
      POSTGRES_DB: ${POSTGRES_DB:-nitka}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
