[project]
name = "nitka"
version = "0.1.0"
description = "Synchronous JSONL document intake and review API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
nitka = "nitka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nitka"]

[tool.hatch.build.targets.sdist]
include = ["nitka", "alembic", "tests", "pyproject.toml", "uv.lock", "README.md", "alembic.ini", "compose.yaml", "Makefile", ".env.example"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires PostgreSQL; uses a separate temporary schema"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["input_docs", "reports", "docs", "analyze_jsonl.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
